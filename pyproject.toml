[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-handoff"
version = "1.0.0"
description = "Move a project from one AI model to another without losing decisions, rejected alternatives, or preferences."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "borodayeh" }]
keywords = ["ai", "handoff", "context", "llm", "agent-skill", "prompt-engineering"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Software Development :: Documentation",
]

[project.urls]
Homepage = "https://github.com/borodayeh/ai-handoff"
Issues = "https://github.com/borodayeh/ai-handoff/issues"
Changelog = "https://github.com/borodayeh/ai-handoff/blob/main/CHANGELOG.md"

[project.scripts]
handoff = "handoff:main"

[tool.setuptools]
py-modules = ["handoff"]
package-dir = { "" = "scripts" }
