name: Bug in the validator or CLI
description: validate, diff, status or new behaves wrongly
labels: ["bug"]
body:
  - type: textarea
    id: command
    attributes:
      label: Command
      placeholder: python3 scripts/handoff.py validate packs/x-pack.md
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Python version and OS
      placeholder: 3.11.9 on macOS 15
